# Site-specific Fluid settings. Keep upstream defaults in themes/fluid/_config.yml.
favicon: /images/site/avatar.jpg
apple_touch_icon: /images/site/avatar.jpg
web_analytics:
  enable: true
  leancloud:
    app_id: htCgd1nqpl7eY5SU3aqYf3db-gzGzoHsz
    app_key: BtCQV3zRTwUc3XGzul8ucGDY
navbar:
  blog_title: Yukari's Blog
footer:
  statistics:
    enable: true
    source: leancloud
    pv_format: 'Total views: {}'
    uv_format: 'Total visitors: {}'
