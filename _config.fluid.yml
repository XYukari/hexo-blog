  name: Yukari
  intro: True understanding comes from practice.
  icons:
    - class: iconfont icon-github-fill
      link: https://github.com/XYukari
      tip: GitHub
    - class: iconfont icon-bilibili-fill
      link: https://space.bilibili.com/266157608
      tip: Bilibili
    - class: iconfont icon-codeforces
      link: https://codeforces.com/profile/XYukari
      tip: Codeforces
  avatar: /images/site/avatar.jpg
links:
  enable: false
